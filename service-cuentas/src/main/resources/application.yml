spring:
  application:
    name: service-cuentas
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eft}
    username: ${DB_USERNAME:eft}
    password: ${DB_PASSWORD:eft}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cloud:
    config:
      fail-fast: false
    discovery:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

resilience4j:
  circuitbreaker:
    instances:
      clientes:
        sliding-window-size: 10
        failure-rate-threshold: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
