spring:
  application:
    name: spring-batch-app

  # DataSource principal: Spring Batch usa esta para sus tablas de metadatos
  datasource:
    url: ${DB_BATCH_URL:jdbc:mysql://localhost:3306/banco_xyz_batch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # DataSources adicionales para escribir datos ETL en las bases de los microservicios core
  datasource-cuentas:
    url: ${DB_CUENTAS_URL:jdbc:mysql://localhost:3306/banco_xyz_cuentas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  datasource-pagos:
    url: ${DB_PAGOS_URL:jdbc:mysql://localhost:3306/banco_xyz_pagos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      # Los jobs son lanzados por JobScheduler, no al arrancar la app
      enabled: false

# ── Política de reintento del job completo ────────────────────────────────────
batch:
  retry:
    max-attempts: 3          # reintentos máximos ante fallo crítico
    initial-delay-ms: 5000   # 5 s entre el 1er y 2do intento; se duplica (backoff exp.)
  schedule:
    # Cron expressions sobrescribibles por variable de entorno
    transacciones: "0 0 1 * * *"   # cada día 01:00 AM
    intereses:     "0 0 2 1 * *"   # primer día de cada mes 02:00 AM
    estados:       "0 0 3 1 1 *"   # 1 de enero 03:00 AM

  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.batch: INFO
