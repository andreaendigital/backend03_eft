spring:
  application:
    name: service-pagos
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banco_xyz_pagos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    username: ${DB_USERNAME:eft}
    password: ${DB_PASSWORD:eft}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: service-pagos
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8082}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
resilience4j:
  circuitbreaker:
    instances:
      cuentas:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      cuentas:
        timeout-duration: 2s
  retry:
    instances:
      cuentas:
        max-attempts: 3
        wait-duration: 200ms
management:
  endpoints:
    web:
      exposure:
        include: health,info
